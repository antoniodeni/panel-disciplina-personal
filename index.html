<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2a3a22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Disciplina">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <title>Panel de Disciplina Personal</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f2f6eb;
      --ink: #20351f;
      --muted: #60705d;
      --line: #cad8c2;
      --panel: #ffffff;
      --soft: #edf4e5;
      --green: #538316;
      --green-deep: #294d24;
      --green-2: #e0efd0;
      --amber: #d28116;
      --amber-2: #fce5c5;
      --red: #b84b45;
      --red-2: #f4deda;
      --blue: #35654b;
      --blue-2: #e1eee1;
      --shadow: 0 1px 2px rgba(31, 60, 27, 0.05), 0 8px 22px rgba(65, 98, 45, 0.07);
      font-family: "Segoe UI Variable", "Segoe UI", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.4;
      border-top: 5px solid var(--green);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button,
    input,
    textarea,
    select {
      transition: border-color 150ms ease, background-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    summary:focus-visible {
      outline: 3px solid rgba(49, 95, 143, 0.2);
      outline-offset: 2px;
    }

    .app {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .auth-shell {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
    }

    .auth-shell[hidden],
    .app[hidden] {
      display: none;
    }

    .auth-card {
      width: min(420px, 100%);
      padding: 26px;
      border: 1px solid var(--line);
      border-top: 5px solid var(--amber);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .auth-brand {
      display: grid;
      justify-items: center;
      gap: 10px;
      margin-bottom: 22px;
      text-align: center;
    }

    .auth-brand img {
      display: none;
    }

    .auth-brand img.auth-brand-logo {
      display: block;
      width: 148px;
      height: auto;
    }

    .auth-brand h1 {
      margin: 0;
      font-size: clamp(24px, 7vw, 34px);
    }

    .auth-card h2 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .auth-card p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .auth-form {
      display: grid;
      gap: 12px;
    }

    .auth-form label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .auth-form input {
      width: 100%;
      margin-top: 5px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
    }

    .auth-actions {
      display: grid;
      gap: 8px;
      margin-top: 4px;
    }

    .auth-link {
      padding: 8px;
      background: transparent;
      color: var(--green-deep);
      font-weight: 800;
      text-decoration: underline;
    }

    .auth-status {
      min-height: 22px;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .auth-status.error {
      color: var(--red);
      font-weight: 700;
    }

    .auth-status.success {
      color: var(--green-deep);
      font-weight: 700;
    }

    .topbar {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-bottom: 4px solid var(--amber);
      border-radius: 8px;
      background: #fffdf8;
      box-shadow: var(--shadow);
    }

    .topbar-logo {
      display: grid;
      place-items: center;
    }

    .topbar-logo img {
      width: 120px;
      height: auto;
      object-fit: contain;
    }

    .topbar-left {
      display: flex;
      align-items: flex-start;
      align-self: start;
      gap: 12px;
      min-width: 0;
    }

    .menu-trigger {
      min-width: 58px;
      min-height: 38px;
      margin-top: 1px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--green-deep);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .menu-trigger:hover,
    .menu-trigger[aria-expanded="true"] {
      background: var(--green);
    }

    .app-menu {
      position: absolute;
      top: calc(100% + 7px);
      left: 0;
      z-index: 50;
      display: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      width: min(336px, 100%);
      gap: 6px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 26px rgba(23, 33, 27, 0.16);
    }

    .app-menu.open {
      display: grid;
    }

    .app-menu button {
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      text-align: left;
    }

    .app-menu button:hover,
    .app-menu button.active {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }

    .date-card {
      position: relative;
      align-self: start;
      justify-self: end;
      width: 62px;
      min-width: 62px;
      background: var(--panel);
      border: 1px solid var(--amber);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(23, 33, 27, 0.04);
      overflow: hidden;
    }

    .date-calendar {
      width: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }

    .date-month {
      display: block;
      padding: 5px 4px;
      background: var(--green-deep);
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-align: center;
    }

    .date-number {
      display: block;
      padding: 7px 4px 5px;
      font-size: 29px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
    }

    .date-picker-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .date-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--line);
    }

    .date-actions button {
      min-height: 23px;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: var(--soft);
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
    }

    .date-actions button:last-child {
      border-right: 0;
    }

    .date-actions button:hover {
      border-color: #b8c1ba;
      background: #e9ede9;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .panel.dashboard-command {
      margin-bottom: 18px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .dashboard-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      padding: 15px 16px;
      border-bottom: 4px solid var(--amber);
      border-radius: 8px;
      background: var(--green-deep);
      color: #fff;
      box-shadow: var(--shadow);
    }

    .dashboard-heading h2,
    .dashboard-heading p {
      margin: 0;
    }

    .dashboard-heading p {
      margin-top: 5px;
      color: #e3ecd8;
      line-height: 1.4;
    }

    .eyebrow {
      display: block;
      margin-bottom: 5px;
      color: #f5c15c;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dashboard-overview {
      display: grid;
      grid-template-columns: 1.25fr repeat(2, minmax(0, 0.8fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .dashboard-pillars {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid #c4d9b5;
      border-top: 4px solid var(--green);
      border-radius: 8px;
      background: var(--soft);
    }

    .dashboard-pillars-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .dashboard-pillars-head h3,
    .dashboard-pillars-head p {
      margin: 0;
    }

    .dashboard-pillars-head p {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .pillar-glance-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 7px;
    }

    .pillar-glance {
      display: grid;
      gap: 3px;
      min-height: 72px;
      padding: 8px;
      border: 1px solid #c9dbbf;
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      text-align: left;
    }

    .pillar-glance:hover {
      border-color: var(--green);
      background: #f7fbf1;
    }

    .pillar-glance-label {
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pillar-glance strong {
      font-size: 20px;
      line-height: 1;
    }

    .pillar-glance small {
      color: var(--muted);
      font-size: 11px;
    }

    .pillar-glance-bar {
      height: 5px;
      overflow: hidden;
      border-radius: 4px;
      background: #e1e6e2;
    }

    .pillar-glance-bar span {
      display: block;
      height: 100%;
      background: var(--green);
    }

    .dashboard-focus {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 12px 0;
      padding: 14px;
      border: 1px solid #c4d9b5;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: #f8fbf3;
    }

    .dashboard-focus-heading {
      grid-column: 1 / -1;
    }

    .dashboard-focus-heading h3,
    .dashboard-focus-heading p {
      margin: 0;
    }

    .dashboard-focus-heading h3 {
      font-size: 16px;
    }

    .dashboard-focus-heading p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .dashboard-actions {
      justify-content: flex-start;
      margin-top: 12px;
    }

    .dashboard-secondary-actions {
      margin-top: 8px;
    }

    .day-tools {
      margin-top: 12px;
      border-top: 1px solid var(--line);
    }

    .day-tools summary {
      padding: 10px 0 2px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .dashboard-agenda {
      margin-top: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-top: 4px solid var(--amber);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .dashboard-agenda-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .dashboard-agenda-head h3,
    .dashboard-agenda-head p {
      margin: 0;
    }

    .dashboard-agenda-head p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .dashboard-agenda-list {
      display: grid;
      gap: 7px;
    }

    .dashboard-agenda-row {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr);
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .dashboard-agenda-row input {
      width: 17px;
      height: 17px;
    }

    .dashboard-agenda-row.done .dashboard-agenda-text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .dashboard-agenda-time {
      min-width: 42px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
      text-align: center;
    }

    .dashboard-agenda-text {
      overflow: hidden;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dashboard-agenda-empty {
      padding: 10px 12px;
      border: 1px dashed var(--line);
      border-radius: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 3px solid var(--green);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 20px;
      letter-spacing: 0;
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 15px;
      letter-spacing: 0;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      background: #f8faf8;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 13px;
      min-height: 96px;
    }

    .dashboard-metric {
      width: 100%;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .dashboard-metric:hover {
      border-color: var(--green);
      background: #f3f8ef;
    }

    .dashboard-metric:focus-visible {
      outline: 3px solid rgba(49, 95, 143, 0.2);
      outline-offset: 2px;
    }

    .dashboard-detail {
      display: grid;
      gap: 12px;
      margin: 0 0 12px;
      padding: 14px;
      border: 1px solid #c4d9b5;
      border-left: 4px solid var(--amber);
      border-radius: 8px;
      background: #fffdf8;
    }

    .dashboard-detail[hidden] {
      display: none;
    }

    .dashboard-detail-head,
    .dashboard-detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dashboard-detail-head h3,
    .dashboard-detail-head p {
      margin: 0;
    }

    .dashboard-detail-head p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .dashboard-detail-list {
      display: grid;
      gap: 10px;
    }

    .dashboard-detail-group {
      display: grid;
      gap: 6px;
    }

    .dashboard-detail-group > strong {
      font-size: 13px;
    }

    .dashboard-detail-row {
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .dashboard-detail-row span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dashboard-detail-status {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 28px;
      line-height: 1;
    }

    .metric small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.3;
    }

    .status {
      border-left: 6px solid var(--amber);
    }

    .status.green {
      border-left-color: var(--green);
      background: var(--green-2);
    }

    .status.yellow {
      border-left-color: var(--amber);
      background: var(--amber-2);
    }

    .status.red {
      border-left-color: var(--red);
      background: var(--red-2);
    }

    .focus-box {
      display: grid;
      gap: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 11px 12px;
      line-height: 1.35;
    }

    .field input:hover,
    .field textarea:hover,
    .task-form input:hover,
    .task-form select:hover {
      border-color: #b8c1ba;
    }

    .field input:focus,
    .field textarea:focus,
    .task-form input:focus,
    .task-form select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(49, 95, 143, 0.1);
    }

    .field textarea {
      min-height: 92px;
      resize: vertical;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 38px;
      border-radius: 6px;
      padding: 9px 14px;
      background: var(--green-deep);
      color: #fff;
      font-weight: 800;
    }

    .btn:hover {
      background: var(--green);
    }

    .btn.secondary:hover {
      background: #e9ede9;
    }

    .btn.secondary {
      background: var(--soft);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .btn.danger {
      background: var(--red-2);
      color: #7d2621;
      border: 1px solid #e4bbb6;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      width: 100%;
      gap: 3px;
      margin: 16px 0 18px;
      position: sticky;
      top: 8px;
      z-index: 8;
      padding: 4px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 4px 16px rgba(23, 33, 27, 0.07);
      backdrop-filter: blur(12px);
    }

    .mobile-nav,
    .mobile-menu-panel {
      display: none;
    }

    .dashboard-links {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .pillar-section {
      margin-top: 20px;
    }

    .pillar-section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0;
      padding: 14px;
      border: 1px solid #c4d9b5;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: #f8fbf3;
    }

    .pillar-section-head h2,
    .pillar-section-head p {
      margin: 0;
    }

    .pillar-section-head p {
      color: var(--muted);
      font-size: 13px;
    }

    .pillar-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .pillar-card {
      display: grid;
      gap: 8px;
      min-height: 142px;
      padding: 13px;
      border: 1px solid var(--line);
      border-top: 3px solid var(--green);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      text-align: left;
      box-shadow: var(--shadow);
    }

    .pillar-card:hover {
      border-color: #aeb8b0;
      border-top-color: var(--green);
      background: #fbfcfb;
    }

    .pillar-card-head,
    .pillar-metric {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .pillar-card-head strong {
      font-size: 15px;
    }

    .pillar-card .pill {
      min-height: 24px;
      padding: 4px 7px;
      font-size: 11px;
    }

    .pillar-objective,
    .pillar-minimum {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .pillar-today {
      color: var(--muted);
      font-size: 12px;
    }

    function updateScore() {
      const snapshot = calculateScore(getDay());
      document.getElementById("scorePercent").textContent = `${snapshot.percent}%`;
      document.getElementById("taskScore").textContent = `${snapshot.doneTasks}/${snapshot.totalTasks}`;
      document.getElementById("statusLabel").textContent = snapshot.label;
      document.getElementById("statusText").textContent = snapshot.text;
      const status = document.getElementById("dayStatus");
      status.className = `metric status ${snapshot.color}`;
    }

      const values = [];
      if (day.badDay) {
        collectValues(day.minimums, values);
      } else {
        collectValues(day.morning, values);
      }
      const habitPoints = values.reduce((sum, value) => sum + valuePoints(value), 0);
      const habitMax = values.length * 2;
      const activeTasks = day.tasks.filter((task) => !task.dismissed && !task.carriedTo);
      const doneTasks = activeTasks.filter((task) => task.done).length;
      const totalTasks = activeTasks.length;
      const taskPoints = doneTasks * 2;
      const taskMax = Math.max(totalTasks * 2, 0);
      const max = habitMax + taskMax;
      const percent = max ? Math.round(((habitPoints + taskPoints) / max) * 100) : 0;
      const hasRecordedValue = values.some((value) => value !== "none");
      if (!hasRecordedValue && !totalTasks) {
        return {
          percent: 0,
          doneTasks,
          totalTasks,
          label: "Sin evaluar",
          color: "",
          text: "El dia aun no tiene resultados registrados."
        };
      }
      let label = "Rojo";
      let color = "red";
      let text = "Dia flojo. Vuelve al minimo.";
      if (percent >= 70) {
        label = "Verde";
        color = "green";
        text = "Dia cumplido con base solida.";
      } else if (percent >= 40) {
        label = "Amarillo";
        color = "yellow";
        text = "Dia salvable. Cierra bien.";
      }
      return { percent, doneTasks, totalTasks, label, color, text };
    }

    function areaScore(area) {
      return area.id === "alimentacion"
        ? nutritionDayPercent(getDay())
        : areaPercentForDay(getDay(), area.id);
    }

    function collectValues(bucket, values, onlyTouched = false) {
      Object.values(bucket || {}).forEach((value) => {
        if (!onlyTouched || value !== "none") values.push(value);
      });
    }

    function valuePoints(value) {
      if (value === "done") return 2;
      if (value === "mid") return 1;
      return 0;
    }

    function ensureDay(dateKey) {
      if (!state.store.days[dateKey]) {
        state.store.days[dateKey] = freshDay(state.store.habitConfig);
        save();
      } else {
        state.store.days[dateKey] = normalizeDay(state.store.days[dateKey], state.store.habitConfig);
      }
    }

    function freshDay(habitConfig) {
      const areaState = {};
      areas.forEach((area) => {
        areaState[area.id] = {};
        (habitConfig?.[area.id] || []).forEach((habit) => {
          areaState[area.id][habit.id] = "none";
        });
      });
      return {
        priority: "",
        nextStep: "",
        parking: "",
        tomorrowFirst: "",
        badDay: false,
        closed: false,
        closedAt: null,
        morning: Object.fromEntries(morningItems.map(([id]) => [id, "none"])),
        minimums: Object.fromEntries(minimumItems.map(([id]) => [id, "none"])),
        areas: areaState,
        tasks: [],
        journal: Object.fromEntries(journalQuestions.map(([id]) => [id, ""])),
        nutrition: {
          readiness: Object.fromEntries(nutritionReadinessItems.map(([id]) => [id, "none"])),
          meals: [],
          rescue: "none"
        }
      };
    }

    function getDay() {
      ensureDay(state.date);
      return state.store.days[state.date];
    }

    function normalizeDay(day, habitConfig) {
      const normalized = day && typeof day === "object" ? day : {};
      normalized.priority = normalized.priority || "";
      normalized.nextStep = normalized.nextStep || "";
      normalized.parking = normalized.parking || "";
      normalized.tomorrowFirst = normalized.tomorrowFirst || "";
      normalized.badDay = Boolean(normalized.badDay);
      normalized.closed = Boolean(normalized.closed);
      normalized.closedAt = normalized.closedAt || null;
      normalized.morning = normalized.morning || {};
      normalized.minimums = normalized.minimums || {};
      normalized.areas = normalized.areas || {};
      normalized.journal = normalized.journal || {};
      normalized.tasks = Array.isArray(normalized.tasks) ? normalized.tasks : [];
      normalized.nutrition = normalized.nutrition && typeof normalized.nutrition === "object"
        ? normalized.nutrition
        : {};
      normalized.nutrition.readiness =
        normalized.nutrition.readiness && typeof normalized.nutrition.readiness === "object"
          ? normalized.nutrition.readiness
          : {};
      normalized.nutrition.meals = Array.isArray(normalized.nutrition.meals)
        ? normalized.nutrition.meals
        : [];
      normalized.nutrition.rescue = normalized.nutrition.rescue || "none";

      morningItems.forEach(([id]) => {
        if (!(id in normalized.morning)) normalized.morning[id] = "none";
      });
      minimumItems.forEach(([id]) => {
        if (!(id in normalized.minimums)) normalized.minimums[id] = "none";
      });
      areas.forEach((area) => {
        normalized.areas[area.id] = normalized.areas[area.id] || {};
        (habitConfig?.[area.id] || []).forEach((habit) => {
          if (!(habit.id in normalized.areas[area.id])) normalized.areas[area.id][habit.id] = "none";
        });
      });
      journalQuestions.forEach(([id]) => {
        if (!(id in normalized.journal)) normalized.journal[id] = "";
      });
      nutritionReadinessItems.forEach(([id]) => {
        if (!(id in normalized.nutrition.readiness)) {
          normalized.nutrition.readiness[id] = "none";
        }
      });
      normalized.nutrition.meals = normalized.nutrition.meals.map((meal) => ({
        id: meal.id || crypto.randomUUID(),
        name: String(meal.name || "Comida"),
        status: ["done", "mid", "no", "none"].includes(meal.status)
          ? meal.status
          : "none"
      }));
      normalized.tasks.forEach((task) => {
        if (!("area" in task)) task.area = "";
        task.time = typeof task.time === "string" && /^\d{2}:\d{2}$/.test(task.time)
          ? task.time
          : "";
        task.important = Boolean(task.important);
      });
      return normalized;
    }

    function createDefaultHabitConfig() {
      const config = {};
      areas.forEach((area) => {
        config[area.id] = area.habits.map(([id, name, hint], index) => ({
          id,
          name,
          minimum: habitMinimumDefaults[id] || hint,
          days: dayOptions.map(([value]) => value),
          active: true,
          order: index
        }));
      });
      return config;
    }

    function normalizeHabitConfig(config) {
      const defaults = createDefaultHabitConfig();
      const normalized = config && typeof config === "object" ? config : {};
      areas.forEach((area) => {
        const existing = Array.isArray(normalized[area.id]) ? normalized[area.id] : [];
        const defaultById = Object.fromEntries(defaults[area.id].map((habit) => [habit.id, habit]));
        const cleaned = existing.map((habit, index) => {
          const fallback = defaultById[habit.id] || {};
          const days = Array.isArray(habit.days)
            ? habit.days.map(Number).filter((value) => value >= 0 && value <= 6)
            : fallback.days || dayOptions.map(([value]) => value);
          return {
            id: habit.id || `personal-${crypto.randomUUID()}`,
            name: String(habit.name || fallback.name || "Habito"),
            minimum: String(habit.minimum ?? fallback.minimum ?? ""),
            days: [...new Set(days.length ? days : dayOptions.map(([value]) => value))],
            active: habit.active !== false,
            order: Number.isFinite(Number(habit.order)) ? Number(habit.order) : index
          };
        });
        defaults[area.id].forEach((habit) => {
          if (!cleaned.some((item) => item.id === habit.id)) cleaned.push(habit);
        });
        normalized[area.id] = cleaned;
      });
      return normalized;
    }

    function normalizeObjectives(objectives, lifePlan, weeklyTargets) {
      const normalized = {};
      areas.forEach((area) => {
        const current = objectives?.[area.id] || {};
        const fallback = objectiveDefaults[area.id];
        normalized[area.id] = {
          statement: String(current.statement || lifePlan?.[area.id] || fallback.statement),
          weeklyTarget: Math.min(
            7,
            Math.max(1, Number(current.weeklyTarget || weeklyTargets?.[area.id] || fallback.weeklyTarget))
          ),
          minimum: String(current.minimum || fallback.minimum)
        };
      });
      return normalized;
    }

    function normalizeNutritionStore(nutrition) {
      const normalized = nutrition && typeof nutrition === "object" ? nutrition : {};
      normalized.shoppingItems = Array.isArray(normalized.shoppingItems)
        ? normalized.shoppingItems.map((item) => ({
            id: item.id || crypto.randomUUID(),
            name: String(item.name || "Producto"),
            bought: Boolean(item.bought),
            available: Boolean(item.available)
          }))
        : [];
      normalized.rescueAction = String(
        normalized.rescueAction || "Preparar una comida sencilla con lo que haya disponible"
      );
      return normalized;
    }

    function migrateStore(store) {
      const migrated = store && typeof store === "object" ? store : {};
      const sourceVersion = Number.isInteger(migrated.schemaVersion) ? migrated.schemaVersion : 1;

      // Las versiones antiguas se completan despues con normalizeStore.
      if (sourceVersion < 2 && !migrated.days) migrated.days = {};
      if (sourceVersion < 3 && !migrated.objectives) migrated.objectives = {};
      if (sourceVersion < 4 && !migrated.nutrition) migrated.nutrition = {};
      migrated.schemaVersion = storeSchemaVersion;
      return migrated;
    }

    function normalizeStore(store) {
      const normalized = migrateStore(store);
      normalized.days = normalized.days && typeof normalized.days === "object" ? normalized.days : {};
      normalized.lifePlan = normalized.lifePlan && typeof normalized.lifePlan === "object"
        ? normalized.lifePlan
        : {};
      normalized.weeklyTargets = normalized.weeklyTargets && typeof normalized.weeklyTargets === "object"
        ? normalized.weeklyTargets
        : {};
      normalized.objectives = normalizeObjectives(
        normalized.objectives,
        normalized.lifePlan,
        normalized.weeklyTargets
      );
      normalized.nutrition = normalizeNutritionStore(normalized.nutrition);
      normalized.habitConfig = normalizeHabitConfig(normalized.habitConfig);
      areas.forEach((area) => {
        normalized.lifePlan[area.id] = normalized.objectives[area.id].statement;
        normalized.weeklyTargets[area.id] = normalized.objectives[area.id].weeklyTarget;
      });
      Object.keys(normalized.days).forEach((key) => {
        normalized.days[key] = normalizeDay(normalized.days[key], normalized.habitConfig);
      });
      return normalized;
    }

    function loadStore() {
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved) return normalizeStore(JSON.parse(saved));
      } catch (error) {
        console.warn("No se pudo cargar el guardado local", error);
      }
      return normalizeStore({ days: {} });
    }

    async function loadRemoteStore() {
      const { data, error } = await authClient
        .from("user_data")
        .select("store")
        .eq("user_id", state.user.id)
        .maybeSingle();
      if (error) throw error;
      return data?.store ? normalizeStore(data.store) : null;
    }

    async function syncRemoteStore() {
      if (!authClient || !state.user || !state.store) return;
      const { error } = await authClient
        .from("user_data")
        .upsert({
          user_id: state.user.id,
          store: state.store,
          updated_at: new Date().toISOString()
        });
      if (error) console.warn("No se pudo sincronizar la cuenta", error);
    }

    function save() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(state.store));
        window.clearTimeout(remoteSyncTimer);
        remoteSyncTimer = window.setTimeout(() => {
          void syncRemoteStore();
        }, 500);
      } catch (error) {
        console.warn("No se pudo guardar", error);
      }
    }

    function getInitialTab() {
      const requested = location.hash.replace("#", "");
      return document.getElementById(requested)?.classList.contains("view")
        ? requested
        : "inicio";
    }

    function activateTab(tabId, updateHash = true) {
      const target = document.getElementById(tabId);
      if (!target?.classList.contains("view")) tabId = "inicio";
      const navigationId = tabId === "alimentacion" ? "areas" : tabId;
      document.querySelectorAll(".app-menu [data-go]").forEach((item) => {
        item.classList.toggle("active", item.dataset.go === navigationId);
      });
      document.querySelectorAll(".view").forEach((item) => {
        item.classList.toggle("active", item.id === tabId);
      });
      if (tabId === "semana") renderWeekly();
      if (tabId === "areas") renderAreas();
      if (tabId === "alimentacion") renderNutrition();
      if (updateHash && location.hash !== `#${tabId}`) {
        history.pushState(null, "", `#${tabId}`);
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleAppMenu() {
      const panel = document.getElementById("appMenuPanel");
      const button = document.getElementById("appMenuBtn");
      const isOpen = panel.classList.toggle("open");
      button.setAttribute("aria-expanded", String(isOpen));
    }

    function closeAppMenu() {
      const panel = document.getElementById("appMenuPanel");
      const button = document.getElementById("appMenuBtn");
      panel.classList.remove("open");
      button.setAttribute("aria-expanded", "false");
    }

    function selectDate(dateKey) {
      state.date = dateKey;
      dayPicker.value = dateKey;
      ensureDay(dateKey);
      renderAll();
    }

    function todayKey() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      return new Date(now.getTime() - offset * 60000).toISOString().slice(0, 10);
    }

    function shiftDate(dateKey, days) {
      const [year, month, day] = dateKey.split("-").map(Number);
      const date = new Date(year, month - 1, day);
      date.setDate(date.getDate() + days);
      const offset = date.getTimezoneOffset();
      return new Date(date.getTime() - offset * 60000).toISOString().slice(0, 10);
    }

    function formatShortDate(key) {
      const [year, month, day] = key.split("-");
      return `${day}/${month}/${year}`;
    }

    function formatLongDate(key) {
      const [year, month, day] = key.split("-").map(Number);
      return new Intl.DateTimeFormat("es-ES", {
        weekday: "long",
        day: "numeric",
        month: "long"
      }).format(new Date(year, month - 1, day));
    }

    function dayRelation(key) {
      if (key === todayKey()) return "today";
      if (key === shiftDate(todayKey(), 1)) return "tomorrow";
      return "other";
    }

    let toastTimer;

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function appendLine(existing, line) {
      return existing ? `${existing}\n${line}` : line;
    }

    function exportBackup() {
      const backup = {
        app: "Panel de Disciplina Personal",
        backupFormatVersion,
        schemaVersion: state.store.schemaVersion,
        exportedAt: new Date().toISOString(),
        data: state.store
      };
      downloadText(
        JSON.stringify(backup, null, 2),
        `copia-disciplina-${todayKey()}.json`,
        "application/json;charset=utf-8"
      );
      showToast("Copia de seguridad creada");
    }

    async function restoreBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        const restored = normalizeStore(parsed.data || parsed);
        if (!Object.keys(restored.days).length && !confirm("La copia no contiene dias guardados. Restaurarla igualmente?")) {
          event.target.value = "";
          return;
        }
        if (!confirm("La restauracion sustituira los datos actuales. Continuar?")) {
          event.target.value = "";
          return;
        }
        state.store = restored;
        state.date = todayKey();
        dayPicker.value = state.date;
        ensureDay(state.date);
        save();
        renderAll();
        activateTab("inicio");
        showToast("Copia restaurada correctamente");
      } catch (error) {
        showToast("La copia no es valida");
      } finally {
        event.target.value = "";
      }
    }

    function downloadText(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    }

    function buildDaySummary(day = getDay()) {
      const score = calculateScore(day);
      const pending = day.tasks.filter((task) => !task.done && !task.dismissed).length;
      return [
        `Balance personal - ${formatShortDate(state.date)}`,
        "",
        `Semaforo: ${score.label}`,
        `Cumplimiento: ${score.percent}%`,
        `Prioridad: ${day.priority || "-"}`,
        `Siguiente paso: ${day.nextStep || "-"}`,
        `Tareas: ${score.doneTasks}/${score.totalTasks} completadas${pending ? `, ${pending} pendientes` : ""}`,
        "",
        "Pilares:",
        ...areas.map((area) => `- ${area.name}: ${pillarStatusText(area, day)}`),
        "",
        "Tareas:",
        ...day.tasks.map((task) => `- [${task.done ? "x" : " "}] ${task.text}`),
        "",
        "Diario:",
        ...journalQuestions.map(([id, label]) => `${label}\n${day.journal[id] || "-"}`),
        "",
        `Primer paso de maÃ±ana: ${day.tomorrowFirst || "-"}`
      ].join("\n");
    }

    async function copyDaySummary() {
      const summary = buildDaySummary();
      try {
        await navigator.clipboard.writeText(summary);
        showToast("Resumen copiado para Kiwi");
      } catch (error) {
        const fallback = document.createElement("textarea");
        fallback.value = summary;
        fallback.setAttribute("readonly", "");
        fallback.style.position = "fixed";
        fallback.style.opacity = "0";
        document.body.appendChild(fallback);
        fallback.select();
        document.execCommand("copy");
        fallback.remove();
        showToast("Resumen copiado para Kiwi");
      }
    }

    function exportDay() {
      downloadText(
        buildDaySummary(),
        `balance-personal-${state.date}.txt`,
        "text/plain;charset=utf-8"
      );
    }

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    }
  </script>
</body>
